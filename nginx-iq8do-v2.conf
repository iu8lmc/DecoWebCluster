# Nuovo frontend IQ8DO DX Cluster — da includere nel server{} di iq8do.aricaserta.it
# Prima prova su /v2/ (il cluster attuale resta intatto); quando sei soddisfatto,
# cambia "location /v2/" in "location = /" e "location /" per servire il nuovo sito alla radice.
#
#   sudo mkdir -p /var/www/iq8do-v2 && sudo tar -xzf iq8do-v2.tar.gz -C /var/www/iq8do-v2
#   sudo nginx -t && sudo systemctl reload nginx

location /v2/ {
    alias /var/www/iq8do-v2/;
    index index.html;
    try_files $uri $uri/ /v2/index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # I dati arrivano dallo stesso cluster (/spotlist, /plot_get_*) e dai dati solari NOAA.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://services.swpc.noaa.gov; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    # File statici: cache lunga per immagini/bandiere, breve per il codice
    location ~* \.(svg|png|jpg|webp)$ { expires 30d; add_header Cache-Control "public, max-age=2592000"; }
    location ~* \.(js|css|webmanifest)$ { expires 5m; add_header Cache-Control "public, max-age=300, must-revalidate"; }
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
}
